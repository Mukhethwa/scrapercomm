    <meta name="theme-color" content="#000000" />
    <!-- Declares that this page has real light AND dark styles. Without it, phone
         browsers with a forced dark mode (Samsung Internet, Chrome's auto-dark) invert
         the page themselves - and they invert the dark theme too, which is what turned
         crisp black into muddy grey and flipped the white chip back to dark. -->
    <meta name="color-scheme" content="light dark" />

      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
