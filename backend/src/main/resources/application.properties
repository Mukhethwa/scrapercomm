# ---------------------------------------------------------------------------
# Commuttr API (Java) — drop-in replacement for the FastAPI service.
# ---------------------------------------------------------------------------

spring.application.name=commuttr-api

# Java 21 Virtual Threads (Project Loom). Tomcat serves each request on a
# virtual thread, and @Async work runs on virtual threads too, so the many
# short blocking JDBC calls in the planner no longer pin platform threads.
spring.threads.virtual.enabled=true

# FastAPI ran on :8000 and the Vite dev server proxies /api there
# (web/vite.config.ts). Serving on the same port keeps the React app untouched.
server.port=${PORT:8000}

# --- Database -------------------------------------------------------------
# The Python scraper owns this database. We only read it (plus one additive
# analytics table). DATABASE_URL in .env is libpq-style; JDBC needs its own URL.
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5433/gabs}
spring.datasource.username=${PGUSER:gabs}
spring.datasource.password=${PGPASSWORD:gabs}
spring.datasource.hikari.pool-name=commuttr-pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}

# NEVER let Hibernate touch the scraper's schema.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Johannesburg

# Creates ONLY the additive search_analytics table (CREATE TABLE IF NOT EXISTS).
# Set to never if you apply sql/analytics.sql out-of-band.
spring.sql.init.mode=${ANALYTICS_SCHEMA_INIT:always}
spring.sql.init.schema-locations=classpath:db/analytics-schema.sql
spring.sql.init.continue-on-error=true

# --- JSON -----------------------------------------------------------------
# Match FastAPI/Pydantic output: ISO dates, nulls preserved, no timestamp ints.
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=always

# --- CORS (see config/WebConfig.java) -------------------------------------
# FastAPI used allow_origins=["*"], allow_methods=["GET"].
commuttr.cors.allowed-origin-patterns=*
commuttr.cors.allowed-methods=GET,OPTIONS,HEAD

# --- Built React UI -------------------------------------------------------
# FastAPI mounted web/dist at "/" when present; same behaviour here.
commuttr.web-dist=${COMMUTTR_WEB_DIST:../web/dist}

# --- Strangler Fig facade -------------------------------------------------
# When enabled, any /api/** path this service does not implement is forwarded
# to the legacy FastAPI process instead of 404-ing. Off once the port is
# complete; flip it on during an incremental cutover.
commuttr.legacy.enabled=${LEGACY_FALLBACK_ENABLED:false}
commuttr.legacy.base-url=${LEGACY_BASE_URL:http://localhost:8001}

# --- Analytics ------------------------------------------------------------
commuttr.analytics.enabled=${ANALYTICS_ENABLED:true}

# --- Geocoding (OpenStreetMap Nominatim, same as the Python service) ------
commuttr.geocode.base-url=https://nominatim.openstreetmap.org/search
commuttr.geocode.timeout-seconds=20
commuttr.geocode.user-agent=${GABS_USER_AGENT:Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36}

# --- Logging --------------------------------------------------------------
logging.level.za.co.commuttr=INFO

# Java camelCase -> snake_case JSON, matching the Pydantic payloads 1:1
# (letterGroup -> letter_group, boardTime -> board_time, ...). Explicit
# @JsonProperty names such as "from"/"to" are left untouched by the strategy.
spring.jackson.property-naming-strategy=SNAKE_CASE
